<text x="34.0" y="152" fill="#c8c8c8" xml:space="preserve">This terminal belongs to Baqer, Software Developer — voted best developer</text>
<text x="34.0" y="173" fill="#c8c8c8" xml:space="preserve">in the world by a jury of exactly one.</text>
<text x="34.0" y="194" fill="#c8c8c8" xml:space="preserve"></text>
<text x="34.0" y="215" fill="#c8c8c8" xml:space="preserve">Use it responsibly. It cannot hack anything, but it can tell you a lot about me.</text>
<text x="34.0" y="236" fill="#c8c8c8" xml:space="preserve"></text>
<text x="34.0" y="257" fill="#64ffda" xml:space="preserve">&gt;</text>
