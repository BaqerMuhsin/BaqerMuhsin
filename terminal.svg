<text x="50.9" y="257" fill="#ffffff" xml:space="preserve" clip-path="url(#type)">baqer -h</text>
<rect x="50.9" y="244" width="8" height="16" fill="#64ffda"><animate attributeName="x" values="50.9;59.3;67.7;76.2;84.6;93.0;101.4;109.9;118.3" calcMode="discrete" begin="3.6s" dur="1.17s" fill="freeze"/><set attributeName="opacity" to="0" begin="5.12s" fill="freeze"/></rect>
<g opacity="0"><set attributeName="opacity" to="1" begin="5.12s" fill="freeze"/>
<text x="34.0" y="278" fill="#c8c8c8" xml:space="preserve">Usage: baqer [option]</text>
<text x="34.0" y="299" fill="#c8c8c8" xml:space="preserve"></text>
<text x="34.0" y="320" fill="#c8c8c8" xml:space="preserve">Options:</text>
<text x="34.0" y="341" fill="#c8c8c8" xml:space="preserve">  -h, --help       show this help message</text>
<text x="34.0" y="362" fill="#c8c8c8" xml:space="preserve">  -a, --about      who I am</text>
<text x="34.0" y="383" fill="#c8c8c8" xml:space="preserve">  -s, --skills     what I work with</text>
<text x="34.0" y="404" fill="#c8c8c8" xml:space="preserve">  -p, --projects   things I've built</text>
<text x="34.0" y="425" fill="#c8c8c8" xml:space="preserve">  -c, --contact    how to reach me</text>
<text x="34.0" y="446" fill="#c8c8c8" xml:space="preserve"></text>
<text x="34.0" y="467" fill="#64ffda" xml:space="preserve">&gt;</text>
